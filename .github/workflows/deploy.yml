name: Deploy Worker to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: cloudflare-worker-production
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Check code and SEO output
        run: |
          npm run lint
          npm run test:seo
          npm run test:worker
          npm run test:indexnow

      - name: Validate Cloudflare API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::CLOUDFLARE_API_TOKEN is missing. Add it as a repository Actions secret before deploying.'
            exit 1
          fi

      - name: Deploy to Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: '65446830387918c7b7a15450c724e9e2'
          wranglerVersion: '4.168.0'
          command: deploy --keep-vars

      - name: Verify the public search foundations
        run: npm run verify:production

      - name: Notify IndexNow of published updates
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            if git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- src/ public/ index.html package.json package-lock.json vite.config.js scripts/prerender.mjs wrangler.jsonc; then
              echo 'No published files changed; skipping IndexNow.'
              exit 0
            fi
          fi
          npm run indexnow:submit
